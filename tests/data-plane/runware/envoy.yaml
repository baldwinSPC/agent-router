admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 1062
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains:
                        - "*"
                      routes:
                        - match:
                            path: /v1/chat/completions
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: runware-chat
                          route:
                            cluster: runware-chat
                            timeout: 10s
                        - match:
                            path: /v1/responses
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: runware-responses
                          route:
                            cluster: runware-responses
                            timeout: 10s
                        - match:
                            path: /v1/chat/completions
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: runware-wrong-key
                          route:
                            cluster: runware-wrong-key
                            timeout: 10s
                        - match:
                            path: /v1/responses
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: runware-wrong-key
                          route:
                            cluster: runware-wrong-key
                            timeout: 10s
                        - match:
                            path: /v1/chat/completions
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: runware-invalid-model
                          route:
                            cluster: runware-invalid-model
                            timeout: 10s
                        - match:
                            path: /v1/responses
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: runware-invalid-model
                          route:
                            cluster: runware-invalid-model
                            timeout: 10s
                        - match:
                            path: /v1/chat/completions
                          direct_response:
                            status: 404
                            body:
                              inline_string: No configured Runware mock model
                        - match:
                            path: /v1/responses
                          direct_response:
                            status: 404
                            body:
                              inline_string: No configured Runware mock model
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                            body:
                              inline_string: No configured Runware mock route
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      message_timeout: 5s
                      grpc_service:
                        envoy_grpc:
                          cluster_name: ext_proc
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: BUFFERED
                      metadataOptions:
                        receivingNamespaces:
                          untyped:
                            - io.envoy.ai_gateway
                      allow_mode_override: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: runware-chat
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: upstream_extproc
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                message_timeout: 5s
                request_attributes:
                  - xds.upstream_host_metadata.filter_metadata['aigateway.envoy.io']['per_route_rule_backend_name']
                processing_mode:
                  request_header_mode: SEND
                  request_body_mode: NONE
                  response_header_mode: SKIP
                  response_body_mode: NONE
                grpc_service:
                  envoy_grpc:
                    cluster_name: ext_proc
                metadataOptions:
                  receivingNamespaces:
                    untyped:
                      - io.envoy.ai_gateway
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: runware-chat
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 11434
                metadata:
                  filter_metadata:
                    aigateway.envoy.io:
                      per_route_rule_backend_name: runware-chat
    - name: runware-responses
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: upstream_extproc
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                message_timeout: 5s
                request_attributes:
                  - xds.upstream_host_metadata.filter_metadata['aigateway.envoy.io']['per_route_rule_backend_name']
                processing_mode:
                  request_header_mode: SEND
                  request_body_mode: NONE
                  response_header_mode: SKIP
                  response_body_mode: NONE
                grpc_service:
                  envoy_grpc:
                    cluster_name: ext_proc
                metadataOptions:
                  receivingNamespaces:
                    untyped:
                      - io.envoy.ai_gateway
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: runware-responses
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 11434
                metadata:
                  filter_metadata:
                    aigateway.envoy.io:
                      per_route_rule_backend_name: runware-responses
    - name: runware-wrong-key
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: upstream_extproc
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                message_timeout: 5s
                request_attributes:
                  - xds.upstream_host_metadata.filter_metadata['aigateway.envoy.io']['per_route_rule_backend_name']
                processing_mode:
                  request_header_mode: SEND
                  request_body_mode: NONE
                  response_header_mode: SKIP
                  response_body_mode: NONE
                grpc_service:
                  envoy_grpc:
                    cluster_name: ext_proc
                metadataOptions:
                  receivingNamespaces:
                    untyped:
                      - io.envoy.ai_gateway
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: runware-wrong-key
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 11434
                metadata:
                  filter_metadata:
                    aigateway.envoy.io:
                      per_route_rule_backend_name: runware-wrong-key
    - name: runware-invalid-model
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: upstream_extproc
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                message_timeout: 5s
                request_attributes:
                  - xds.upstream_host_metadata.filter_metadata['aigateway.envoy.io']['per_route_rule_backend_name']
                processing_mode:
                  request_header_mode: SEND
                  request_body_mode: NONE
                  response_header_mode: SKIP
                  response_body_mode: NONE
                grpc_service:
                  envoy_grpc:
                    cluster_name: ext_proc
                metadataOptions:
                  receivingNamespaces:
                    untyped:
                      - io.envoy.ai_gateway
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: runware-invalid-model
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 11434
                metadata:
                  filter_metadata:
                    aigateway.envoy.io:
                      per_route_rule_backend_name: runware-invalid-model
    - name: ext_proc
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ext_proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: extproc
                      port_value: 1063
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
