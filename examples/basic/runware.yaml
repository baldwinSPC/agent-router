apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: runware-chat
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: runware-chat
      backendRefs:
        - name: runware
          modelNameOverride: minimax:m2.7@0
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: runware-responses
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: runware-responses
      backendRefs:
        - name: runware
          modelNameOverride: openai:gpt@5.4-mini
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: runware
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: runware
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: runware-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: runware
  type: APIKey
  apiKey:
    secretRef:
      name: runware-apikey
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: runware
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: api.runware.ai
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: runware-tls
  namespace: default
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: runware
  validation:
    wellKnownCACertificates: System
    hostname: api.runware.ai
